name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build test targets
        run: >-
          cmake --build build --parallel 2 --target
          segmented_block_gtest
          test_concurrent_gtest
          sbtree_single_thread_test

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --timeout 120
